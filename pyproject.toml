[project]
name = "djangoharness-cookiecutter"
version = "0.1.0"
description = "Cookiecutter template for DjangoHarness business projects."
requires-python = ">=3.10,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "cookiecutter>=2.6,<3.0",
    "pytest>=8.0,<9.0",
]

[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["template_tests"]
