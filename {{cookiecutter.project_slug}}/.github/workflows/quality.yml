name: Quality

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    name: Lint, test, and docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: |
          echo "[__PRODUCT_NAME__] 安装 Python 3.10"
          uv python install 3.10

      - name: Install dependencies
        run: |
          echo "[__PRODUCT_NAME__] 安装依赖"
          uv sync --all-groups --locked

      - name: Run checks
        run: |
          echo "[__PRODUCT_NAME__] 执行质量检查"
          make lint
          make test
          make docs-build
          uv lock --check
