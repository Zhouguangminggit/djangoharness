site_name: __PRODUCT_NAME__ 文档
site_description: __PRODUCT_SUBTITLE__

theme:
  name: material
  language: zh
  icon:
    logo: material/application-braces-outline
    repo: fontawesome/brands/github
  features:
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.path
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

nav:
  - 首页: index.md
  - 文档站:
      - 概览: mkdocs/index.md
      - MkDocs + Material: mkdocs/guide.md
      - 生产配置: deploy.md
      - Cookiecutter 模板: cookiecutter/README.md
  - 开发环境:
      - 概览: environments/index.md
      - macOS: macos/README.md
      - Windows: windows/README.md
  - 开发工具:
      - 概览: tools/index.md
      - uv: uv/README.md
      - Makefile: makefile/README.md
      - Ruff: ruff/README.md
      - mypy: mypy/README.md
      - pytest: pytest/README.md
      - mdformat: mdformat/README.md
  - 框架能力:
      - 概览: framework/index.md
      - 二期能力: framework/phase-two.md
      - 用户认证: authentication.md
      - 消息通知: notifications.md
      - 博客模块: blog.md
      - AI 集成: ai-integration.md
      - Celery: celery/README.md
      - Unfold 后台管理: unfold/README.md
  - 迭代记录:
      - 概览: iterations/index.md
      - allauth 基础与迁移: iterations/19-allauth-foundation.md
      - allauth 登录退出: iterations/20-allauth-login.md
      - allauth 注册验证: iterations/21-allauth-signup.md
      - allauth 密码与文档: iterations/22-allauth-password-docs.md
      - 消息通知中心: iterations/23-notifications-center.md
      - Unfold 后台迁移: iterations/24-unfold-admin.md
      - MkDocs + Material 集成: iterations/18-mkdocs-material.md
      - 博客模块: iterations/25-blog-module.md
      - AI 集成模块: iterations/26-ai-integration.md
      - Cookiecutter 模板服务: iterations/28-cookiecutter-template.md
      - Cookiecutter 当前目录落地说明: iterations/29-cookiecutter-current-directory.md
      - 部署优化: iterations/30-deployment-optimization.md
      - 二期依赖与配置: iterations/31-phase-two-foundation.md
      - 二期 Unfold 后台: iterations/32-phase-two-admin.md
      - 二期 Crispy Forms: iterations/33-phase-two-forms.md
      - 二期产品介绍: iterations/34-phase-two-introduction.md
      - 二期导航与消息: iterations/35-phase-two-shell.md
      - 二期验收收口: iterations/36-phase-two-release.md

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

strict: true
