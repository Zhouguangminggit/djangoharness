name: __PROJECT_SLUG__

x-app: &app
  image: ${__DOCKER_IMAGE_ENV__:-__PROJECT_SLUG__:local}
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  env_file:
    - path: ../.env
      required: false
  environment:
    DJANGO_SETTINGS_MODULE: __PROJECT_PACKAGE__.settings.prod
  restart: unless-stopped

services:
  web:
    <<: *app
    command:
      - /bin/sh
      - -c
      - python manage.py migrate --noinput && python manage.py ensure_superuser && python manage.py collectstatic --noinput && gunicorn __PROJECT_PACKAGE__.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile - --error-logfile -
    ports:
      - ${APP_PORT:-8000}:8000
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/health/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *app
    command: celery -A celery_app worker --loglevel=INFO --concurrency=2
    volumes:
      - media_data:/app/media

volumes:
  static_data:
  media_data:
