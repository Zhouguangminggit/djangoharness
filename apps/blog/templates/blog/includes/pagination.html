{% if page.has_other_pages %}
  <nav class="blog-pagination" aria-label="分页">
    {% if page.has_previous %}
      <a href="?page={{ page.previous_page_number }}{% if request.GET.tag %}&tag={{ request.GET.tag }}{% endif %}">上一页</a>
    {% else %}
      <span class="is-disabled">上一页</span>
    {% endif %}

    <span class="blog-pagination__info">第 {{ page.number }} / {{ page.paginator.num_pages }} 页</span>

    {% if page.has_next %}
      <a href="?page={{ page.next_page_number }}{% if request.GET.tag %}&tag={{ request.GET.tag }}{% endif %}">下一页</a>
    {% else %}
      <span class="is-disabled">下一页</span>
    {% endif %}
  </nav>
{% endif %}
